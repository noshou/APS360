# Default config for the local CLI path (python train.py --config runs/default.yaml).
# Missing keys fall back to RunConfig dataclass defaults; CLI flags override.

# paths - local defaults; override on the CLI for other environments.
# hdf5 and encodings_sqlite3_path are downloaded from HuggingFace (noshou/iq_train_set)
# or Kaggle (noso0s0n/iql50); see Preprocess/README.md.
hdf5:                    Preprocess/I(q)@L=50.h5
encodings_sqlite3_path:  Preprocess/iq_train_set-ENCODING.sqlite3
ckpt_best: scatternet_best.pt
# Directory for numbered resume checkpoints; each mid-phase/phase-boundary save
# writes its own file (checkpoint_<epoch>_<phase>_<batch>.pt, "final" at phase
# boundaries; phase is train/val/test) instead of overwriting a single fixed path.
ckpt_dir:  checkpoints

# Everything the run records, per epoch, under {data_dir}/epoch_{N:03d}/: metrics.json
# (that epoch's train/val/test loss + R2), loss_per_epoch.png, and
# baseline-style diagnostic plots on the test set (per-q R2, per-q percent error, Kratky
# overlay, residual histogram, error-vs-atom-count). The diagnostic plots reuse
# Baselines/metrics.py unmodified (see Train/eval_plots.py) so they are directly
# comparable to Baselines/kaggle_baselines.ipynb's. The run's full config is dumped once
# to {data_dir}/run_config.rtf. Nothing is written per-run except that dump, so a resume
# cannot overwrite an earlier epoch's numbers; concatenate the per-epoch metrics.json
# files afterwards for the whole history. Needs the same LaTeX/JuliaMono toolchain
# Baselines/kaggle_baselines.ipynb installs.
data_dir: scatternet_data

# rclone destinations for off-box durability (vast.ai local disk is not assumed
# durable across instance teardown). ckpt_best and numbered resume checkpoints are
# deleted locally once pushed (see Train/train.py:_rclone_push); data_dir is pushed
# every epoch but kept locally too, since load_epoch_history() reads it back each
# epoch to rebuild loss_per_epoch.png.
ckpt_rclone_dest: gdrive:ScatterNet_Train/checkpoints
data_rclone_dest: gdrive:ScatterNet_Train/data

# model architecture
lambda_1: 128
lambda_2: 4
lambda_3: 256
lambda_4: 4
lambda_5: 128
msg_seed: 42
# Root cause found and fixed: torch.compile on an outer function that
# calls into any runtime-type-checked function (even indirectly, via
# normal Python/nn.Module dispatch) forced dynamo to trace into that
# checker's own internals and crash. Fixed by removing all runtime
# type-checking from the codebase (and from the pyteals dependency)
# entirely, rather than working around the compile boundary case by case.
compile: true

# chunking (peak-memory vs launch-count tradeoff; see README Appendix A1). 1024/512
# OOM'd on 2xT4 (12.13/14.56G already in use, +3.19G alloc). 800/400 was also tried
# (post RMSNorm-autocast + .contiguous() recompile fixes) and rejected: same ~880ms/batch
# steady-state as 512/256 but ~55% more peak memory (8.9G vs 5.8G) and bigger compile
# stalls - compute is invariant to chunk size, so bigger chunks bought nothing here.
# 512/256 was the best measured point, but that was under small-bucket tiering
# (MessagePass rounded a bucket's real N/M down to a shared tier instead of the
# full chunk). Tiering was removed (it caused a separate torch.compile recompile-
# limit crash) in favor of always padding to the full (atm_chunk, mol_chunk),
# which OOM'd on a 40G A100 at 512/256, then again at 256/128 - the real problem
# was forcing tiny buckets (e.g. 7 molecules) to pad up to the full chunk size
# (18x+ blowup), not the chunk size itself. Fixed properly by compiling
# MessagePass's step functions with dynamic=True and padding small buckets only
# to a small alignment instead of the full chunk (see message_pass.py's
# "Compile shapes" docstring). Left at 256/128, conservatively, until a live run
# confirms real headroom - raise back toward 512/256 only once that's measured.

atm_chunk: 256
mol_chunk: 128

# numerical floors
eps_embd: 1.0e-8
eps_msgp: 1.0e-3

# loss (RunConfig.__post_init__ coerces these to float, so an int like `1` won't
# cause a dtype mismatch later inside compute_loss -- still write 1.0, not 1)
lambda_6: 1.0

# optimiser / training loop
lr:            1.3e-4
weight_decay:  0.1
grad_clip:     1.0
epochs:        33
dataset_frac:  0.05
batcher_seed:  0
atom_size_ceil: -1   # -1 = auto (3x largest molecule)
num_workers: 4
