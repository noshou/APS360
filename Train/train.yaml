# Default config for the local CLI path (python train.py --config runs/default.yaml).
# The Kaggle notebook (kaggle_train.ipynb) builds RunConfig in Python and does NOT
# read this file; that notebook is the source of truth. Keep the knobs below in sync
# with it. Missing keys fall back to RunConfig dataclass defaults; CLI flags override.

# paths - local defaults; override on the CLI for other environments.
# hdf5 and encodings_sqlite3_path are downloaded from HuggingFace (noshou/iq_train_set)
# or Kaggle (noso0s0n/iql50); see Preprocess/README.md.
hdf5:                    Preprocess/I(q)@L=50.h5
encodings_sqlite3_path:  Preprocess/iq_train_set-ENCODING.sqlite3
ckpt_best:   scatternet_best.pt
ckpt_resume: scatternet_resume.pt

# Everything the run records, per epoch, under {data_dir}/epoch_{N:03d}/: metrics.json
# (that epoch's train/val/test loss + R2), loss_per_batch.png, loss_per_epoch.png, and
# baseline-style diagnostic plots on the test set (per-q R2, per-q percent error, Kratky
# overlay, residual histogram, error-vs-atom-count). The diagnostic plots reuse
# Baselines/metrics.py unmodified (see Train/eval_plots.py) so they are directly
# comparable to Baselines/kaggle_baselines.ipynb's. The run's full config is dumped once
# to {data_dir}/run_config.rtf. Nothing is written per-run except that dump, so a resume
# cannot overwrite an earlier epoch's numbers; concatenate the per-epoch metrics.json
# files afterwards for the whole history. Off by default (the plots need the same LaTeX/
# JuliaMono toolchain Baselines/kaggle_baselines.ipynb installs) - uncomment to enable.
# data_dir: scatternet_data

# model architecture
lambda_1: 128
lambda_2: 4
lambda_3: 64
lambda_4: 4
lambda_5: 128
msg_seed: 42

# chunking (peak-memory vs launch-count tradeoff; see README Appendix A1). 1024/512
# OOM'd on 2xT4 (12.13/14.56G already in use, +3.19G alloc). 800/400 was also tried
# (post RMSNorm-autocast + .contiguous() recompile fixes) and rejected: same ~880ms/batch
# steady-state as 512/256 but ~55% more peak memory (8.9G vs 5.8G) and bigger compile
# stalls - compute is invariant to chunk size, so bigger chunks bought nothing here.
# 512/256 chosen as the best measured point.
atm_chunk: 512
mol_chunk: 256

# parallelism routing (multi-GPU only; see README ScatterNet section 7)
dp_atom_threshold: 101   # calibrated for 2x T4: 1.8x faster, peak 13.55G. 0 = always TP.

# numerical floors
eps_embd: 1.0e-8
eps_msgp: 1.0e-3

# loss (RunConfig.__post_init__ coerces these to float, so an int like `1` won't
# crash later inside the beartype-guarded Loss.loss() call -- still write 1.0, not 1)
lambda_6: 1.0
lambda_7: 0.5

# optimiser / training loop
lr:            1.3e-4
weight_decay:  0.1
grad_clip:     1.0
epochs:        20
batcher_seed:  0
atom_size_ceil: -1   # -1 = auto (3x largest molecule)
num_workers: 4
